<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>كوب | لوحة التحكم</title>
<link rel="icon" href="img/mark-crimson.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#9F1344;--wine-d:#7E0F36;--cream:#F1DAC0;--paper:#FFF8F0;--line:#EADFCC;--ink:#3A2619;--muted:#8A7461;--ok:#4F7A3A;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
button,input{font:inherit}
.top{background:var(--wine);color:#fff;padding:calc(14px + var(--safe-t)) 18px 14px;display:flex;align-items:center;gap:14px}
.top img{height:30px}
.top h1{margin:0;font-size:18px}.top p{margin:2px 0 0;font-size:12.5px;color:#F3D3DA}
.top .out{margin-inline-start:auto;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px calc(30px + var(--safe-b))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;max-width:420px;margin:40px auto}
.card h2{margin:0 0 4px;color:var(--wine);font-size:20px}.card p{margin:0 0 16px;color:var(--muted);font-size:14px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.in{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--paper);font-size:15px}
.btn{width:100%;height:48px;border:0;border-radius:12px;background:var(--wine);color:#fff;font-weight:600;margin-top:16px;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:wait}
.err{color:var(--wine);font-size:13px;margin-top:10px;min-height:18px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
.stats{display:flex;gap:16px;font-size:14px}.stats b{font-size:18px;color:var(--ok)}.stats .o b{color:var(--wine)}
#q{flex:1;min-width:180px;max-width:320px}
.filt{display:flex;gap:6px}.filt button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.filt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
h3{margin:20px 0 8px;font-size:15px;color:var(--wine)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;transition:background .2s}
.row.off{background:#F7EDEF;border-color:#EBC9D1}.row.off .ph{filter:grayscale(1);opacity:.55}
.row.busy{opacity:.6}
.ph{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;background:#F3EBDD}.ph img{width:100%;height:100%;object-fit:cover}
.t{flex:1;min-width:0}.t b{display:block;font-size:14.5px}.t small{color:var(--muted);font-size:12px}
.st{font-size:12px;font-weight:600;color:var(--ok);white-space:nowrap}.off .st{color:var(--wine)}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:20px;background:#D9C9B1;position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw:checked{background:var(--ok)}.sw:checked::after{right:23px}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
a{color:var(--wine)}
</style>
</head>
<body>
<div class="top"><img src="img/logo-cream.png" alt="COB"><div><h1>لوحة التحكم</h1><p>توفّر منتجات المنيو</p></div><button class="out" id="out" hidden>تسجيل خروج</button></div>

<div class="wrap">
 <form class="card" id="login" hidden>
  <h2>تسجيل الدخول</h2>
  <p>ادخل بحساب الإدارة.</p>
  <label class="f" for="em">الإيميل</label><input class="in" id="em" type="email" autocomplete="username" required dir="ltr">
  <label class="f" for="pw">كلمة السر</label><input class="in" id="pw" type="password" autocomplete="current-password" required dir="ltr">
  <button class="btn" id="go" type="submit">دخول</button>
  <div class="err" id="lerr" role="alert"></div>
 </form>

 <div id="panel" hidden>
  <div class="bar"><div class="stats" id="stats"></div><input class="in" id="q" type="search" placeholder="ابحث عن منتج…" autocomplete="off"></div>
  <div class="filt"><button data-f="all" class="on">الكل</button><button data-f="off">المخفية فقط</button></div>
  <p class="hint">أطفئ المنتج إذا خلص — يختفي من منيو العملاء فوراً، وشغّله لما يتوفر. <a href="./" target="_blank" rel="noopener">فتح المنيو</a></p>
  <div id="list"></div>
 </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://laxnbguluaebjccsngnm.supabase.co",SB_KEY="sb_publishable_xKdluhsD5f88JqlcCGJkzA_lO4oK6Nk";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const D=JSON.parse($("#menu-data").textContent);
let avail={},filter="all";
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1800)}
function show(id){["#login","#panel"].forEach(s=>$(s).hidden=s!==id);$("#out").hidden=id!=="#panel"}

async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return show("#login");
 const {data:ok,error}=await sb.rpc("is_menu_admin");
 if(error||!ok){await sb.auth.signOut();show("#login");$("#lerr").textContent="هذا الحساب ما عنده صلاحية إدارة المنيو.";return}
 show("#panel");await load();
}
async function load(){
 const {data,error}=await sb.from("menu_items").select("id,available");
 if(error){toast("تعذّر تحميل البيانات");return}
 avail={};data.forEach(r=>avail[r.id]=r.available);render();
}
function render(){
 const q=($("#q").value||"").trim().toLowerCase();
 const items=D.items.filter(i=>i.id in avail);
 const off=items.filter(i=>!avail[i.id]).length;
 $("#stats").innerHTML=`<span><b>${items.length-off}</b> متوفر</span><span class="o"><b>${off}</b> مخفي</span>`;
 $("#list").innerHTML=D.categories.map(c=>{
  const its=items.filter(i=>i.cat===c.id&&(filter==="all"||!avail[i.id])&&(!q||(i.name.ar+" "+i.name.en).toLowerCase().includes(q)));
  if(!its.length)return"";
  return `<h3>${esc(c.name.ar)}</h3>`+its.map(i=>`<label class="row ${avail[i.id]?"":"off"}" data-row="${i.id}"><span class="ph">${i.image?`<img src="${esc(i.image)}" alt="" loading="lazy">`:""}</span><span class="t"><b>${esc(i.name.ar)}</b><small>${esc(i.name.en)}${i.price!=null?" · "+i.price+" ر.س":""}</small></span><span class="st">${avail[i.id]?"متوفر":"خلص"}</span><input type="checkbox" class="sw" data-id="${i.id}" ${avail[i.id]?"checked":""} aria-label="${esc(i.name.ar)}"></label>`).join("");
 }).join("")||`<p class="hint" style="text-align:center;padding:30px">ما فيه منتجات هنا.</p>`;
}
document.addEventListener("change",async e=>{
 const el=e.target.closest(".sw");if(!el)return;
 const id=el.dataset.id,val=el.checked,row=el.closest(".row");row.classList.add("busy");el.disabled=true;
 const {data,error}=await sb.from("menu_items").update({available:val}).eq("id",id).select("id,available");
 el.disabled=false;row.classList.remove("busy");
 if(error||!data||!data.length){el.checked=!val;toast("ما انحفظ التغيير، حاول مرة ثانية");return}
 avail[id]=data[0].available;render();
 const n=D.items.find(i=>i.id===id).name.ar;toast(val?`${n} رجع للمنيو`:`${n} انخفى من المنيو`);
});
$("#q").addEventListener("input",render);
document.querySelectorAll(".filt button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll(".filt button").forEach(x=>x.classList.toggle("on",x===b));render()});
$("#login").addEventListener("submit",async e=>{
 e.preventDefault();$("#lerr").textContent="";$("#go").disabled=true;
 const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
 $("#go").disabled=false;$("#pw").value="";
 if(error){$("#lerr").textContent="الإيميل أو كلمة السر غير صحيحة.";return}
 boot();
});
$("#out").onclick=async()=>{await sb.auth.signOut();show("#login")};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#panel").hidden)load()});
boot();
</script>
