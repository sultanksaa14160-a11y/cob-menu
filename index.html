<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كوب | COB — المنيو</title>
<link rel="icon" href="img/mark-crimson.png">
<meta name="description" content="منيو كوب | COB — قهوة مختصة ومخبوزات وفطور في خميس مشيط.">
<meta name="theme-color" content="#9E1F35">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Poppins:wght@400;500;600&family=Kanit:wght@400;500&family=Noto+Naskh+Arabic:wght@500;600;700&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F1E6; --bg2:#FFFCF6; --panel:#EFE6D6; --line:#E4D8C4; --line2:#D9C9B1;
  --paper:#FFFDF8; --paper2:#F3EBDD; --pline:#EADFCC; --ink:#3A2619; --pmuted:#8A7461;
  --cream:#3A2619; --muted:#7E6A58; --copper:#A8643F; --wine:#B3263C; --wine-l:#B3263C;
  --green:#E9ECDC; --green2:#D3DAB9; --ok:#5E7E45;
  --serif-ar:"Cairo","IBM Plex Sans Arabic",sans-serif; --serif-en:"Poppins",system-ui,sans-serif; --sans:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;overflow-x:hidden}
.col-intro .deco{display:none}
@media(min-width:1100px){.col-intro .deco{display:block}}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px;border-radius:8px}
.serif{font-family:var(--serif-ar)} [lang=en] .serif{font-family:var(--serif-en)}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--copper);font-weight:500;text-transform:uppercase}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
.deco{position:absolute;pointer-events:none;color:#A8643F;opacity:.22}

/* header */
header{position:sticky;top:0;z-index:40;background:rgba(247,241,230,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:var(--safe-t);border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-color:var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;color:var(--wine-l)}
.brand svg{height:28px;width:84px;flex:none}
.brand small{white-space:nowrap;color:var(--muted);font-size:12px;border-inline-start:1px solid var(--line2);padding-inline-start:10px}
nav.main{display:none;gap:30px;margin:0 auto}
nav.main a{font-size:15px;color:var(--cream);opacity:.85;position:relative;padding:6px 0}
nav.main a.on{opacity:1}
nav.main a.on::after{content:"";position:absolute;bottom:-2px;inset-inline-start:25%;width:50%;height:2px;background:var(--copper);border-radius:2px}
.tools{display:flex;align-items:center;gap:4px;margin-inline-start:auto}
.open-pill{display:none;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:10px;padding:7px 12px;font-size:13px}
.open-pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(127,163,106,.18)}
.open-pill b{color:var(--ok);font-weight:500}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;transition:background .2s}
.ib:hover{background:var(--panel)}
.ib svg{width:20px;height:20px}
.badge{position:absolute;top:3px;inset-inline-end:1px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--wine);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center}
.badge[data-n="0"]{display:none}
.lang{font-size:12.5px;font-weight:500;background:#fff;border:1px solid var(--line2);border-radius:20px;padding:6px 12px;margin-inline-start:4px}

/* layout */
.layout>*{min-width:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding-top:18px;padding-bottom:10px;position:relative}
.col-intro{position:relative}
.intro h1{font-family:var(--serif-ar);font-weight:600;font-size:34px;line-height:1.35;margin:10px 0 10px;color:var(--cream)}
[lang=en] .intro h1{font-family:var(--serif-en);font-size:42px;line-height:1.1;font-weight:500}
.intro p{color:var(--muted);margin:0 0 6px;font-size:15.5px;max-width:420px}
.values{display:none;flex-direction:column;gap:12px;margin-top:22px}
.val{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.val.green{background:var(--green);border-color:var(--green2)}
.val .ic{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid rgba(179,38,60,.35);background:#fff;display:grid;place-items:center;color:var(--wine)}
.val .ic svg{width:22px;height:22px}
.val h3{margin:0;font-family:var(--serif-ar);font-size:17px;font-weight:600}
[lang=en] .val h3{font-family:var(--serif-en);font-size:20px;font-weight:500}
.val p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

/* menu column */
.col-menu{min-width:0}
.searchrow{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.search input{flex:1;border:0;background:none;outline:none;color:var(--cream);height:100%;min-width:0}
.search input::placeholder{color:#A8957F}
.search .clr{display:none;color:var(--muted);font-size:20px;padding:4px}
.search.has .clr{display:block}
.fbtn{height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fbtn.on{border-color:var(--wine);color:var(--wine);background:#fff}
.fbtn svg{width:15px;height:15px}
.tabs-wrap{position:sticky;top:calc(64px + var(--safe-t));z-index:20;padding:6px 0 10px;background:linear-gradient(var(--bg) 75%,rgba(247,241,230,0))}
.tabs{display:flex;gap:4px;padding:5px;border:1px solid var(--line);border-radius:40px;background:var(--bg2);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 18px;border-radius:30px;font-size:14.5px;color:var(--cream);opacity:.85;white-space:nowrap;transition:all .25s}
.tab.on{background:var(--wine);color:#fff;opacity:1;font-weight:500}
.menucard{background:var(--paper);color:var(--ink);border-radius:18px;padding:6px 18px 4px;box-shadow:0 24px 50px -30px rgba(90,55,30,.35);border:1px solid var(--pline);position:relative;overflow:hidden}
.menucard::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 100% 0,rgba(255,255,255,.35),transparent 60%);pointer-events:none}
.mc-head{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0 6px;border-bottom:1px solid var(--pline)}
.mc-head h2{margin:0;font-family:var(--serif-ar);font-size:22px;font-weight:600}
[lang=en] .mc-head h2{font-family:var(--serif-en);font-size:26px;font-weight:600}
.mc-head small{color:var(--pmuted);font-size:12.5px}
.row{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--pline);width:100%;text-align:start;position:relative;animation:rise .35s ease both}
.row:last-child{border-bottom:0}
.row .ph{flex:none;width:66px;height:66px;border-radius:50%;overflow:hidden;background:var(--paper2);border:1px solid var(--pline)}
.row .ph img{width:100%;height:100%;object-fit:cover}
.row .tx{flex:1;min-width:0}
.row .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.row h3{margin:0;font-family:var(--serif-ar);font-size:18px;font-weight:600;line-height:1.4}
[lang=en] .row h3{font-family:var(--serif-en);font-size:21px;font-weight:600;line-height:1.2}
.row h3 .star{color:var(--copper);font-size:14px;margin-inline-start:4px}
.row .pr{flex:none;font-family:var(--serif-en);font-size:19px;font-weight:600;color:var(--ink)}
.row .pr.tbd{font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--pmuted)}
.row p{margin:2px 0 0;color:var(--pmuted);font-size:13.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tg{font-size:10.5px;letter-spacing:.06em;border:1px solid var(--pline);color:#6F5B49;padding:2px 8px;border-radius:4px;font-weight:500}
.tg.w{border-color:rgba(163,33,58,.4);color:var(--wine)}
.row.off{opacity:.5}.row.off img{filter:grayscale(1)}
.fv{flex:none;width:32px;height:32px;display:grid;place-items:center;color:#A89582;margin-inline-start:-4px}
.fv svg{width:18px;height:18px}
.fv.on{color:var(--wine)} .fv.on svg path{fill:currentColor}
.fv.pop{animation:pop .35s}
.noimg{width:100%;height:100%;display:grid;place-items:center;font-family:var(--serif-en);color:var(--wine);font-size:15px;letter-spacing:.06em;background:var(--paper2)}
.empty{padding:40px 10px;text-align:center;color:var(--pmuted)} .empty b{display:block;color:var(--ink);font-size:16px}
.mc-foot{display:flex;justify-content:center;padding:14px 0 12px;border-top:1px solid var(--pline)}
.mc-foot button{font-size:14.5px;display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-weight:500}
.mc-foot svg{width:16px;height:16px}
[dir=rtl] .fl{transform:scaleX(-1)}

/* side column */
.col-side{display:flex;flex-direction:column;gap:14px}
.seasonal{position:relative;overflow:hidden;background:var(--green);border:1px solid var(--green2);border-radius:18px;padding:22px;min-height:230px}
.seasonal h3{font-family:var(--serif-ar);font-size:26px;font-weight:600;margin:8px 0 6px;line-height:1.35;max-width:62%}
[lang=en] .seasonal h3{font-family:var(--serif-en);font-size:32px;font-weight:500;line-height:1.1}
.seasonal p{color:#5F6B4C;margin:0 0 12px;font-size:13.5px;max-width:60%}
.seasonal .pr{font-family:var(--serif-en);font-size:22px;font-weight:600}
.seasonal .pr.tbd{font-family:var(--sans);font-size:12px;color:#5F6B4C}
.seasonal .branch{position:absolute;inset-inline-end:-10px;top:10px;width:46%;color:#7F9460;opacity:.55}
.seasonal .seal{position:absolute;inset-inline-end:16px;bottom:16px;width:86px;color:#B3263C;opacity:.75}
.seasonal button.more{margin-top:12px;font-size:13px;color:var(--wine);border-bottom:1px solid rgba(179,38,60,.4)}
.demo{display:block;margin-top:8px;font-size:11px;color:#7E8A69}
.paper-card{position:relative;overflow:hidden;border:1px solid var(--pline);background:var(--paper);color:var(--ink);border-radius:18px;padding:20px}
.paper-card .eyebrow{color:var(--copper)}
.paper-card h3{font-family:var(--serif-ar);font-size:20px;margin:6px 0 4px;font-weight:600}
[lang=en] .paper-card h3{font-family:var(--serif-en);font-size:24px;font-weight:600}
.paper-card p{margin:0;color:var(--pmuted);font-size:13.5px;max-width:62%}
.paper-card .mnt{position:absolute;inset-inline-end:-6px;bottom:-4px;width:52%;color:#A8643F;opacity:.75}
.picks{display:flex;gap:10px;margin-top:14px;overflow-x:auto;scrollbar-width:none;position:relative;z-index:1}
.picks::-webkit-scrollbar{display:none}
.pick{flex:none;width:96px;text-align:center}
.pick .ph{width:72px;height:72px;margin:0 auto;border-radius:50%;overflow:hidden;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--pline)}
.pick .ph img{width:100%;height:100%;object-fit:cover}
.pick span{display:block;font-size:12.5px;margin-top:6px;line-height:1.35;font-weight:500}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px}
.mini .h{display:flex;justify-content:space-between;align-items:center}
.mini .h svg{width:20px;height:20px;color:var(--copper)}
.mini .big{font-family:var(--serif-ar);font-size:19px;font-weight:600;line-height:1.35}
[lang=en] .mini .big{font-family:var(--serif-en);font-size:22px}
.mini .sm{color:var(--muted);font-size:13px}
.mini .status{margin-top:auto;display:flex;align-items:center;justify-content:space-between;color:var(--ok);font-size:14px;padding-top:8px;border-top:1px solid var(--line)}
.mini .status i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.btn-copper{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--wine);color:#fff;border-radius:10px;height:42px;font-size:14px;font-weight:500}
.btn-copper svg{width:16px;height:16px}
.pending{margin-top:auto;font-size:12px;color:#9A8673;border-top:1px dashed var(--line2);padding-top:8px}

/* strip */
.strip{border-top:1px solid var(--line);margin-top:26px;position:relative;overflow:hidden}
.strip .wrap{display:grid;grid-template-columns:1fr;gap:18px;padding-top:24px;padding-bottom:calc(30px + var(--safe-b))}
.si{display:flex;gap:14px;align-items:center}
.si .ic{flex:none;width:54px;height:54px;border-radius:50%;border:1px solid var(--line2);background:#fff;display:grid;place-items:center;color:var(--wine)}
.si .ic svg{width:24px;height:24px}
.si h4{margin:0;font-family:var(--serif-ar);font-size:16px;font-weight:600}
[lang=en] .si h4{font-family:var(--serif-en);font-size:19px}
.si p{margin:0;color:var(--muted);font-size:13px}
.fine{color:#9A8673;font-size:11.5px;text-align:center;padding:0 18px 24px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(40,25,15,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:92vh;background:var(--paper);color:var(--ink);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden;padding-bottom:var(--safe-b)}
.sheet.show{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--pline);margin:9px auto 0;flex:none}
.sheet .scroll{overflow-y:auto;overscroll-behavior:contain}
.pd-media{position:relative;margin:10px 14px 0;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:var(--paper2)}
.pd-media img{width:100%;height:100%;object-fit:cover;animation:fade .35s}
.pd-media .noimg{font-size:30px}
.circ{width:38px;height:38px;border-radius:50%;background:rgba(239,229,214,.94);display:grid;place-items:center;color:var(--ink)}
.circ svg{width:18px;height:18px}
.pd-close{position:absolute;top:10px;inset-inline-end:10px;z-index:3}
.pd-nav{position:absolute;bottom:10px;inset-inline-end:10px;display:flex;gap:8px;z-index:3}
.pd-body{padding:16px 20px 18px}
.pd-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pd-body h2{margin:0;font-family:var(--serif-ar);font-size:24px;line-height:1.35}
[lang=en] .pd-body h2{font-family:var(--serif-en);font-size:30px;line-height:1.1}
.pd-body .alt{font-family:var(--serif-en);font-style:italic;color:var(--pmuted);font-size:17px}
[lang=en] .pd-body .alt{font-family:var(--serif-ar);font-style:normal;font-size:15px}
.pd-body .pr{font-family:var(--serif-en);font-size:24px;font-weight:600}
.pd-body .pr.tbd{font-family:var(--sans);font-size:12px;color:var(--pmuted);border:1px dashed var(--pline);padding:3px 8px;border-radius:6px;white-space:nowrap}
.pd-body .desc{margin:10px 0 0;font-size:15px}
.blk{margin-top:14px;padding-top:12px;border-top:1px solid var(--pline)}
.blk h4{margin:0 0 3px;font-size:12px;letter-spacing:.1em;color:var(--copper);font-weight:500}
.blk p{margin:0;font-size:14px} .blk .na{color:var(--pmuted);font-size:13px}
.acts{display:flex;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--pline);flex:none}
.btn{flex:1;height:50px;border-radius:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-p{background:var(--wine);color:#fff}
.btn-p[disabled]{opacity:.4;cursor:not-allowed}
.btn-s{flex:0 0 50px;border:1px solid var(--pline);color:var(--wine)}
.btn-s.wide{flex:1;color:var(--ink)}
.btn-s svg{width:20px;height:20px} .btn-s.on svg path{fill:currentColor}
.dr h3{margin:14px 20px 2px;font-family:var(--serif-ar);font-size:22px}
[lang=en] .dr h3{font-family:var(--serif-en);font-size:26px}
.dr .sub{margin:0 20px 10px;color:var(--pmuted);font-size:13px}
.li{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--pline)}
.li .ph{width:54px;height:54px;border-radius:50%;overflow:hidden;flex:none;background:var(--paper2)}
.li .ph img{width:100%;height:100%;object-fit:cover}
.li .t{flex:1;min-width:0;text-align:start} .li .t b{display:block;font-size:15px} .li .t small{color:var(--pmuted)}
.qty{display:flex;align-items:center;gap:4px;border:1px solid var(--pline);border-radius:30px;padding:2px}
.qty button{width:30px;height:30px;border-radius:50%;font-size:18px}
.qty span{min-width:18px;text-align:center;font-weight:600}
.tot{display:flex;justify-content:space-between;padding:14px 20px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:14px;opacity:0;transition:all .3s;z-index:80;pointer-events:none;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{50%{transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

@media (min-width:760px){
  .strip .wrap{grid-template-columns:repeat(3,1fr)}
  .open-pill{display:inline-flex}
  .sheet{left:50%;right:auto;bottom:50%;width:min(560px,92vw);border-radius:22px;transform:translate(-50%,60%) scale(.97);opacity:0;transition:all .3s}
  .sheet.show{transform:translate(-50%,50%);opacity:1}
  .grab{display:none}
}
@media (min-width:1100px){
  nav.main{display:flex}
  .brand small{display:none}
  .layout{grid-template-columns:minmax(260px,.95fr) minmax(0,1.35fr) minmax(300px,1.05fr);gap:26px;padding-top:30px;align-items:start}
  .col-intro{position:sticky;top:94px}
  .values{display:flex}
  .intro h1{font-size:44px}
  [lang=en] .intro h1{font-size:60px}
  .col-side{position:sticky;top:94px}
  .tabs-wrap{position:static;padding-top:0}
  .menucard{max-height:calc(100vh - 210px);overflow-y:auto;scrollbar-width:thin}
}

/* ---- wine-forward overrides ---- */
:root{--wine:#9E1F35;--wine-d:#7E1629;--wine-l:#F3DADF}
header{background:rgba(158,31,53,.97)!important;color:#FBEFE6}
header.scrolled{border-color:var(--wine-d)}
.brand{color:#FBEFE6}.brand small{color:#F0CFC7;border-color:rgba(255,255,255,.25)}
nav.main a{color:#FBEFE6}
nav.main a.on::after{background:#F3C9A9}
.ib:hover{background:rgba(255,255,255,.12)}
.badge{background:#FBEFE6;color:var(--wine)}
.lang{background:transparent;border-color:rgba(255,255,255,.4);color:#FBEFE6}
.open-pill{border-color:rgba(255,255,255,.3);color:#FBEFE6}.open-pill b{color:#CFE6B8}.open-pill i{background:#CFE6B8}
.eyebrow{color:var(--wine)}
.intro h1{color:var(--wine)}
.val .ic{color:var(--wine);border-color:rgba(158,31,53,.45)}
